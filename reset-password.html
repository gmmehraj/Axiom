<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Choose new password — Axiom</title><link rel="stylesheet" href="styles/motion-tokens.css"><link rel="stylesheet" href="styles/base.css"><link rel="stylesheet" href="styles/rtl.css"><link rel="stylesheet" href="styles/vision-glass-theme.css"><link rel="stylesheet" href="styles/accessibility.css"></head><body><div class="grain"></div><div class="aurora"><span></span><span></span><span></span></div><main class="auth-page"><div class="auth-card"><div class="auth-head"><span class="auth-logo">A</span><p class="auth-eyebrow">Account recovery</p><h1>Choose a new password</h1><p>Set a new password for your Axiom account.</p></div><div id="authError" role="alert" style="display:none;background:rgba(242,101,122,.1);border:1px solid rgba(242,101,122,.3);color:var(--a-coral);padding:.7rem .9rem;border-radius:var(--radius-s);margin-bottom:1.2rem"></div><form class="auth-form" id="resetForm"><div class="field"><label for="newPassword">New password</label><input type="password" id="newPassword" minlength="8" autocomplete="new-password" required></div><div class="field"><label for="confirmPassword">Confirm password</label><input type="password" id="confirmPassword" minlength="8" autocomplete="new-password" required></div><button class="btn btn-solid btn-full" type="submit">Update password</button></form></div></main><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script defer src="js/core/env.config.js"></script><script defer src="js/core/supabase/env.js"></script><script defer src="js/core/supabase/connection-manager.js"></script><script defer src="js/core/supabase/auth-service.js"></script><script defer src="js/core/supabase-config.js"></script><script defer src="js/core/auth-enhancements.js"></script><script>document.getElementById('resetForm').addEventListener('submit',async function(e){e.preventDefault();var p=document.getElementById('newPassword').value,c=document.getElementById('confirmPassword').value;if(p.length<8){window.AxiomAuthUX.showError('Password must be at least 8 characters.');return;}if(p!==c){window.AxiomAuthUX.showError('Passwords do not match.');return;}var b=this.querySelector('button');b.disabled=true;b.textContent='Updating…';var r=await supabaseClient.auth.updateUser({password:p});if(r.error){b.disabled=false;b.textContent='Update password';window.AxiomAuthUX.showError(window.AxiomAuthUX.friendlyError(r.error));return;}this.innerHTML='<div class="auth-head"><h2>Password updated</h2><p>Your Axiom password has been changed successfully.</p></div><p class="auth-foot"><a href="login.html">Sign in to Axiom</a></p>';});</script></body></html>
