name: Integrate mobile shell files

on:
  push:
    branches:
      - feat/mobile-shell-reference-redesign

permissions:
  contents: write

jobs:
  integrate:
    if: "!contains(github.event.head_commit.message, '[mobile-shell-integrated]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/mobile-shell-reference-redesign
          fetch-depth: 0

      - name: Wire mobile shell into os-shell.html
        shell: python
        run: |
          from pathlib import Path

          path = Path('os-shell.html')
          text = path.read_text(encoding='utf-8')

          css = '  <link rel="stylesheet" href="styles/mobile-shell-reference.css">\n'
          js = '<script defer src="js/core/mobile-shell.js"></script>\n'

          if 'styles/mobile-shell-reference.css' not in text:
              marker = '</head>'
              if marker not in text:
                  raise SystemExit('Missing </head> marker')
              text = text.replace(marker, css + marker, 1)

          if 'js/core/mobile-shell.js' not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('Missing </body> marker')
              text = text.replace(marker, js + marker, 1)

          path.write_text(text, encoding='utf-8')

      - name: Remove temporary integration workflow
        run: rm -f .github/workflows/mobile-shell-integrate.yml

      - name: Commit integrated mobile shell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add os-shell.html styles/mobile-shell-reference.css js/core/mobile-shell.js .github/workflows/mobile-shell-integrate.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat(mobile): integrate reference shell [mobile-shell-integrated]"
          git push origin HEAD:feat/mobile-shell-reference-redesign
