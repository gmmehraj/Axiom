<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AXIOM Production Verification Runner</title>
  <link rel="stylesheet" href="/styles/ax-design-system.css">
  <style>
    body { background: #0a0b0e; color: #f0f2f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 24px; line-height: 1.5; }
    .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-weight: 600; font-size: 13px; margin-left: 10px; }
    .badge-pass { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; }
    .badge-fail { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }
    .badge-running { background: rgba(59, 130, 246, 0.2); color: #3b82f6; border: 1px solid #3b82f6; }
    pre { background: rgba(0,0,0,0.5); padding: 12px; border-radius: 8px; font-size: 12px; overflow-x: auto; max-height: 300px; }
    .test-step { margin-bottom: 12px; padding-left: 10px; border-left: 3px solid rgba(255,255,255,0.1); }
    .step-pass { border-left-color: #10b981; }
    .step-fail { border-left-color: #ef4444; }
  </style>

  <!-- Required Axiom Core Scripts with absolute paths -->
  <script src="/js/core/env.config.js"></script>
  <script src="/js/core/supabase/env.js"></script>
  <script src="/js/core/supabase/connection-manager.js"></script>
  <script src="/js/core/supabase/auth-service.js"></script>
  <script src="/js/core/supabase-config.js"></script>
  <script src="/os/core/axiom-brain.js"></script>
  <script src="/js/core/voice.js"></script>
  <script src="/js/core/voice-controller.js"></script>
  <script src="/os/runtime/capabilities/voice-adapter-kit.js"></script>
  <script src="/js/core/elevenlabs-voice.js"></script>
  <script src="/js/core/elevenlabs-scribe.js"></script>
  <script src="/js/core/elevenlabs-voice-controller.js"></script>
  <script src="/js/core/voice-website-controller.js"></script>
  <script src="/js/core/voice-ui-bridge.js"></script>
  <script src="/js/core/voice-user-greeting.js"></script>
</head>
<body>
  <h1>AXIOM Live Production Verification Suite</h1>
  <p>Verifying ZERO console/network errors and real voice lifecycle execution.</p>
  
  <div class="card">
    <h2>Real Voice Lifecycle Test <span id="voice-test-status" class="status-badge badge-running">RUNNING</span></h2>
    <div id="voice-log"></div>
  </div>

  <div class="card">
    <h2>Console & Network Error Tracker</h2>
    <div>Console Errors: <strong id="console-error-count">0</strong></div>
    <div>Network Errors: <strong id="network-error-count">0</strong></div>
    <div>Supabase Status: <strong id="supabase-status">Checking...</strong></div>
    <pre id="error-log">None</pre>
  </div>

  <div class="card">
    <h2>Major Pages Voice Navigation Test</h2>
    <div id="pages-log"></div>
  </div>

  <script src="/test-evidence/real-browser-voice-verification.js"></script>
</body>
</html>
