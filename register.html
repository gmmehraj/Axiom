<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Create your account — Axiom</title><link rel="stylesheet" href="styles/motion-tokens.css"><link rel="stylesheet" href="styles/base.css"><link rel="stylesheet" href="styles/rtl.css"><link rel="stylesheet" href="styles/vision-glass-theme.css"><link rel="stylesheet" href="styles/accessibility.css"></head><body><div class="grain"></div><div class="aurora"><span></span><span></span><span></span></div><a href="index.html" class="auth-back">← Back to Axiom</a><main id="main" class="auth-page"><div class="auth-card"><div class="auth-head"><span class="auth-logo">A</span><p class="auth-eyebrow">Nine models. One account.</p><h1>Create your account</h1><p>Start free — your Axiom workspace is created automatically.</p></div><div id="authError" role="alert" aria-live="assertive" style="display:none;background:rgba(242,101,122,.1);border:1px solid rgba(242,101,122,.3);color:var(--a-coral);padding:.7rem .9rem;border-radius:var(--radius-s);margin-bottom:1.2rem"></div><form class="auth-form" id="registerForm"><div class="field"><label for="regName">Full name</label><input type="text" id="regName" placeholder="Ada Lovelace" autocomplete="name" maxlength="80" required data-auth-clear-error></div><div class="field"><label for="regEmail">Email</label><input type="email" id="regEmail" placeholder="you@company.com" autocomplete="email" maxlength="254" required data-auth-clear-error></div><div class="field"><label for="regPassword">Password</label><input type="password" id="regPassword" placeholder="At least 8 characters" autocomplete="new-password" required minlength="8" data-auth-clear-error></div><div class="field"><label for="regPasswordConfirm">Confirm password</label><input type="password" id="regPasswordConfirm" placeholder="Enter your password again" autocomplete="new-password" required minlength="8" data-auth-clear-error></div><div class="check-row"><input type="checkbox" id="regTerms" required><label for="regTerms">I agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</label></div><button type="submit" class="btn btn-solid btn-full">Create account</button></form><p class="auth-foot">Already have an account? <a href="login.html">Sign in</a></p></div></main><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script defer src="js/core/env.config.js"></script><script defer src="js/core/supabase/env.js"></script><script defer src="js/core/supabase/connection-manager.js"></script><script defer src="js/core/supabase/auth-service.js"></script><script defer src="js/core/supabase-config.js"></script><script defer src="js/core/auth-enhancements.js"></script><script defer src="js/core/auth.js"></script><script defer src="components/ax-dialogs.js"></script><script defer src="js/core/script.js"></script><script defer src="js/core/accessibility.js"></script><script>document.getElementById('registerForm').addEventListener('submit',function(e){var p=document.getElementById('regPassword').value,c=document.getElementById('regPasswordConfirm').value;if(p!==c||p.length<8){e.preventDefault();e.stopImmediatePropagation();window.AxiomAuthUX.showError(p!==c?'Passwords do not match.':'Password must be at least 8 characters.');if(p!==c)document.getElementById('regPasswordConfirm').focus();}},true);</script></body></html>
