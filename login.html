<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>Sign in — Axiom</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preconnect" href="https://cdn.jsdelivr.net"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles/motion-tokens.css"><link rel="stylesheet" href="styles/base.css"><link rel="stylesheet" href="styles/rtl.css"><link rel="stylesheet" href="styles/vision-glass-theme.css"><link rel="stylesheet" href="styles/accessibility.css"></head>
<body><a href="#main" class="skip-link">Skip to main content</a><div class="grain"></div><div class="aurora"><span></span><span></span><span></span><div class="particles" id="particles"></div></div><a href="index.html" class="auth-back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="common.backToAxiom">Back to Axiom</span></a><div class="lang-switch-corner"><select id="langQuickSwitch" class="lang-select" aria-label="Language"></select></div>
<main id="main" tabindex="-1" class="auth-page"><div class="auth-card"><div class="auth-head"><span class="auth-logo"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2 L22 20 L2 20 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 9 L16.5 17 L7.5 17 Z" fill="currentColor"/></svg></span><p class="auth-eyebrow" data-i18n="auth.welcomeBack">Welcome back</p><h1 data-i18n="auth.signInTitle">Sign in to Axiom</h1><p data-i18n="auth.signInSubtitle">Pick up right where you left off, across every model.</p></div><div id="authError" role="alert" aria-live="assertive" style="display:none; background:rgba(242,101,122,.1); border:1px solid rgba(242,101,122,.3); color:var(--a-coral); font-size:.83rem; padding:.7rem .9rem; border-radius:var(--radius-s); margin-bottom:1.2rem;"></div><form class="auth-form" id="loginForm"><div class="field"><label for="loginEmail" data-i18n="auth.email">Email</label><input type="email" id="loginEmail" placeholder="you@company.com" autocomplete="email" required data-auth-clear-error></div><div class="field"><div class="field-row"><label for="loginPassword" data-i18n="auth.password">Password</label><a href="forgot-password.html" data-i18n="auth.forgotPassword">Forgot password?</a></div><input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required data-auth-clear-error></div><button type="submit" class="btn btn-solid btn-full" data-i18n="auth.signIn">Sign in</button></form><p class="auth-foot"><span data-i18n="auth.noAccount">Don't have an account?</span> <a href="register.html" data-i18n="auth.createOne">Create one</a></p></div></main>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script defer src="js/core/env.config.js"></script><script defer src="js/core/supabase/env.js"></script><script defer src="js/core/supabase/connection-manager.js"></script><script defer src="js/core/supabase/auth-service.js"></script><script defer src="js/core/supabase-config.js"></script><script defer src="js/core/auth-enhancements.js"></script><script defer src="locales/_registry.js"></script><script defer src="js/core/i18n.js"></script><script defer src="js/core/auth.js"></script><script defer src="components/ax-dialogs.js"></script><script defer src="js/core/script.js"></script><script defer src="js/core/accessibility.js"></script><script>function populateLangSwitch(s){s.innerHTML=window.AxiomLanguages.map(l=>`<option value="${l.code}">${l.native}</option>`).join('');}document.addEventListener('DOMContentLoaded',()=>{const s=document.getElementById('langQuickSwitch');populateLangSwitch(s);document.addEventListener('axiom:lang-changed',e=>s.value=e.detail.code);s.addEventListener('change',()=>window.AxiomI18n.setLanguage(s.value));});</script></body></html>
