<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Reset password — Axiom</title><link rel="stylesheet" href="styles/motion-tokens.css"><link rel="stylesheet" href="styles/base.css"><link rel="stylesheet" href="styles/rtl.css"><link rel="stylesheet" href="styles/vision-glass-theme.css"><link rel="stylesheet" href="styles/accessibility.css"></head><body><div class="grain"></div><div class="aurora"><span></span><span></span><span></span></div><a href="login.html" class="auth-back">← Back to sign in</a><main class="auth-page"><div class="auth-card"><div class="auth-head"><span class="auth-logo">A</span><p class="auth-eyebrow">Account recovery</p><h1>Reset your password</h1><p>Enter your email and we'll send you a secure reset link.</p></div><div id="authError" role="alert" style="display:none;background:rgba(242,101,122,.1);border:1px solid rgba(242,101,122,.3);color:var(--a-coral);padding:.7rem .9rem;border-radius:var(--radius-s);margin-bottom:1.2rem"></div><form class="auth-form" id="forgotForm"><div class="field"><label for="resetEmail">Email</label><input type="email" id="resetEmail" autocomplete="email" placeholder="you@company.com" required></div><button class="btn btn-solid btn-full" type="submit">Send reset link</button></form><p class="auth-foot"><a href="login.html">Back to sign in</a></p></div></main><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script defer src="js/core/env.config.js"></script><script defer src="js/core/supabase/env.js"></script><script defer src="js/core/supabase/connection-manager.js"></script><script defer src="js/core/supabase/auth-service.js"></script><script defer src="js/core/supabase-config.js"></script><script defer src="js/core/auth-enhancements.js"></script><script>document.getElementById('forgotForm').addEventListener('submit',async function(e){e.preventDefault();var b=this.querySelector('button'),email=window.AxiomAuthUX.normalizeEmail(document.getElementById('resetEmail').value);window.AxiomAuthUX.clearError();b.disabled=true;b.textContent='Sending…';var r=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+'/reset-password.html'});b.disabled=false;b.textContent='Send reset link';if(r.error){window.AxiomAuthUX.showError(window.AxiomAuthUX.friendlyError(r.error));return;}this.innerHTML='<div class="auth-head"><h2>Check your inbox</h2><p>If an Axiom account exists for that email, a secure password reset link has been sent.</p></div><p class="auth-foot"><a href="login.html">Back to sign in</a></p>';});</script></body></html>
